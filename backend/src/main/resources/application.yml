server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:castly_api}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 10000
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
castly:
  jwt:
    issuer: ${SUPABASE_JWT_ISSUER}
    audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
    mode: ${JWT_SIGNING_MODE:jwks}
    public-key: ${SUPABASE_PUBLISHABLE_KEY:}
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
