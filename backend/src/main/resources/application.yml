server:
  port: ${PORT:8080}
  address: 0.0.0.0
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  sql:
    init:
      mode: never
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:castly_api}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 10000
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
castly:
  phase5:
    advanced-search-enabled: ${CASTLY_ADVANCED_SEARCH_ENABLED:false}
    ai-recommendations-enabled: ${CASTLY_AI_RECOMMENDATIONS_ENABLED:false}
    smart-matching-enabled: ${CASTLY_SMART_MATCHING_ENABLED:false}
    ai-assistance-enabled: ${CASTLY_AI_ASSISTANCE_ENABLED:false}
  google:
    enabled: ${CASTLY_GOOGLE_PLAY_ENABLED:false}
    checkout-enabled: ${CASTLY_GOOGLE_PLAY_CHECKOUT_ENABLED:false}
    package-name: ${GOOGLE_PLAY_PACKAGE_NAME:}
    credentials-file: ${GOOGLE_PLAY_CREDENTIALS_FILE:}
    account-key: ${GOOGLE_PLAY_ACCOUNT_KEY:}
    rtdn-audience: ${GOOGLE_RTDN_AUDIENCE:}
    rtdn-email: ${GOOGLE_RTDN_SERVICE_ACCOUNT_EMAIL:}
  subscriptions:
    enabled: ${CASTLY_SUBSCRIPTIONS_ENABLED:false}
  booking-diagnostics:
    enabled: ${CASTLY_BOOKING_DIAGNOSTICS_ENABLED:false}
  notifications:
    enabled: ${CASTLY_NOTIFICATIONS_ENABLED:false}
  jwt:
    issuer: ${SUPABASE_JWT_ISSUER}
    audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
    mode: ${JWT_SIGNING_MODE:jwks}
    public-key: ${SUPABASE_PUBLISHABLE_KEY:}
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
