server:
  port: ${PORT:8080}
  address: 0.0.0.0
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  sql:
    init:
      mode: never
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:castly_api}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 10000
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
castly:
  booking-diagnostics:
    enabled: ${CASTLY_BOOKING_DIAGNOSTICS_ENABLED:false}
  notifications:
    enabled: ${CASTLY_NOTIFICATIONS_ENABLED:false}
  jwt:
    issuer: ${SUPABASE_JWT_ISSUER}
    audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
    mode: ${JWT_SIGNING_MODE:jwks}
    public-key: ${SUPABASE_PUBLISHABLE_KEY:}
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
