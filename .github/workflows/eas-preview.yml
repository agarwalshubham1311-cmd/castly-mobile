name: Castly Android Preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/milestone5-booking-messaging-notifications
    paths:
      - '.github/workflows/eas-preview.yml'
      - 'eas.json'
      - 'app.config.ts'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: castly-android-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-preview:
    name: Request EAS preview APK build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_EAS_PROJECT_ID: 45b573ec-4b24-400e-af1e-94766ed1eb36
      CASTLY_ANDROID_PACKAGE: com.castly.mobile
      EXPO_PUBLIC_BACKEND_MODE: supabase
      EXPO_PUBLIC_BUSINESS_API_MODE: spring
      EXPO_PUBLIC_ISOLATED_SUPABASE_FALLBACK: 'false'
    steps:
      - name: Checkout existing branch
        uses: actions/checkout@v4

      - name: Verify Expo token is configured
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Repository Actions secret EXPO_TOKEN is missing."
            exit 1
          fi

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify existing EAS project
        run: eas project:info --non-interactive

      - name: Start Android preview APK build
        run: eas build --platform android --profile preview --non-interactive --no-wait
